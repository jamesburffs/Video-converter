name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# The release job below needs write access to create a release and attach
# assets - the default GITHUB_TOKEN is otherwise read-only on newer repos.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: VidKonverter-linux
            dist_path: dist/VidKonverter
          - os: macos-latest
            artifact: VidKonverter-macos
            dist_path: dist/VidKonverter-macos.zip
          - os: windows-latest
            artifact: VidKonverter-windows
            dist_path: dist/VidKonverter.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Build
        run: python packaging/build.py

      # PyInstaller's macOS output is a VidKonverter.app *bundle* - a
      # directory, not a single file. actions/upload-artifact uploads a
      # directory's contents rather than the directory itself, so without
      # this the artifact would come out as a loose Contents/ folder with
      # no .app wrapper for macOS to recognize as an application. Zipping
      # it ourselves first, with VidKonverter.app as the zip's own
      # top-level entry, keeps the bundle intact end to end.
      - name: Zip the macOS app bundle
        if: runner.os == 'macOS'
        run: cd dist && zip -rq VidKonverter-macos.zip VidKonverter.app

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dist_path }}

  # Only runs for an actual version tag push (not a manual workflow_dispatch
  # against a branch) - zips each platform's build and publishes them as
  # assets on a GitHub Release for that tag, created automatically.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      # Each artifact folder holds either one already-zipped file (macOS,
      # zipped in the build job above to keep its .app bundle intact) or
      # the raw single-file binary/exe (Linux/Windows) - either way, turn
      # it into one <artifact-name>.zip release asset.
      - name: Package each platform build for release
        run: |
          cd dist-artifacts
          for dir in */; do
            name="${dir%/}"
            existing_zip=$(find "$name" -maxdepth 1 -name '*.zip')
            if [ -n "$existing_zip" ]; then
              mv "$existing_zip" "${name}.zip"
            else
              (cd "$name" && zip -rq "../${name}.zip" .)
            fi
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*.zip
          generate_release_notes: true
