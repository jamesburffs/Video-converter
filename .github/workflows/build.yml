name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# The release job below needs write access to create a release and attach
# assets - the default GITHUB_TOKEN is otherwise read-only on newer repos.
permissions:
  contents: write

jobs:
  # Linux only for now - macOS and Windows builds need more testing/work
  # before they're ready to publish as releases (see build/build_deb.py/
  # build_rpm.py in packaging/ if picking those back up later).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt

      # rpmbuild isn't part of the default ubuntu-latest image - dpkg-deb
      # is (it's core Debian/Ubuntu tooling), so nothing extra is needed
      # for the .deb.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build standalone executable
        run: python packaging/build.py

      - name: Build .deb package
        run: python packaging/build_deb.py

      - name: Build .rpm package
        run: python packaging/build_rpm.py

      - name: Zip the standalone executable
        run: cd dist && zip -rq VidKonverter-linux.zip VidKonverter

      - uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            dist/VidKonverter-linux.zip
            dist/*.deb
            dist/*.rpm

  # Only runs for an actual version tag push (not a manual workflow_dispatch
  # against a branch) - publishes the build job's outputs as assets on a
  # GitHub Release for that tag, created automatically.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-builds
          path: dist-artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
          generate_release_notes: true
