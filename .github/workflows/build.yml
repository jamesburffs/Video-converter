name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# The release job below needs write access to create a release and attach
# assets - the default GITHUB_TOKEN is otherwise read-only on newer repos.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: VidKonverter-linux
            dist_path: dist/VidKonverter
          - os: macos-latest
            artifact: VidKonverter-macos
            dist_path: dist/VidKonverter.app
          - os: windows-latest
            artifact: VidKonverter-windows
            dist_path: dist/VidKonverter.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Build
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dist_path }}

  # Only runs for an actual version tag push (not a manual workflow_dispatch
  # against a branch) - zips each platform's build and publishes them as
  # assets on a GitHub Release for that tag, created automatically.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Zip each platform build
        run: |
          cd dist-artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -rq "../${name}.zip" .)
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*.zip
          generate_release_notes: true
