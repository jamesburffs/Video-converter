name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# The release job below needs write access to create a release and attach
# assets - the default GITHUB_TOKEN is otherwise read-only on newer repos.
permissions:
  contents: write

jobs:
  # Windows still needs more testing/work before it's worth building at
  # all (see the README's platform-support note). macOS builds again as
  # of the ensure_macos_homebrew_on_path() fix (see external_env.py) for
  # ffmpeg/Homebrew detection in a double-clicked .app - but isn't wired
  # into the release job below yet, pending real testing on a real Mac.
  # Flip that on once confirmed working.
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt

      # rpmbuild isn't part of the default ubuntu-latest image - dpkg-deb
      # is (it's core Debian/Ubuntu tooling), so nothing extra is needed
      # for the .deb.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build standalone executable
        run: python packaging/build.py

      - name: Build .deb package
        run: python packaging/build_deb.py

      - name: Build .rpm package
        run: python packaging/build_rpm.py

      - name: Zip the standalone executable
        run: cd dist && zip -rq VidKonverter-linux.zip VidKonverter

      - uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            dist/VidKonverter-linux.zip
            dist/*.deb
            dist/*.rpm

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Build standalone executable
        run: python packaging/build.py

      # PyInstaller's macOS output is a VidKonverter.app *bundle* - a
      # directory, not a single file. actions/upload-artifact uploads a
      # directory's contents rather than the directory itself, so without
      # this the artifact would come out as a loose Contents/ folder with
      # no .app wrapper for macOS to recognize as an application. Zipping
      # it ourselves first, with VidKonverter.app as the zip's own
      # top-level entry, keeps the bundle intact end to end.
      - name: Zip the macOS app bundle
        run: cd dist && zip -rq VidKonverter-macos.zip VidKonverter.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/VidKonverter-macos.zip

  # Only runs for an actual version tag push (not a manual workflow_dispatch
  # against a branch) - publishes build-linux's outputs as assets on a
  # GitHub Release for that tag, created automatically. Deliberately
  # doesn't need build-macos, and doesn't publish its artifact yet - see
  # the comment on that job above.
  release:
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-builds
          path: dist-artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
          generate_release_notes: true
